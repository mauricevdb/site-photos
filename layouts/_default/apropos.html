{{ define "main" }}
<article class="apropos-c">
  <h1>{{ .Title }}</h1>
  <div class="apropos-texte">{{ .Content }}</div>
  {{ with .Params.instagram }}
  <a class="lien-instagram" href="{{ . }}" rel="me noopener" target="_blank" aria-label="Instagram">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
    <span>Instagram</span>
  </a>
  {{ end }}
</article>

<div class="apropos-images">
  {{ range slice .Params.velo .Params.carte }}
    {{ if . }}
    {{ $ch := strings.TrimPrefix "/" . }}
    {{ $img := resources.Get $ch }}
    <figure>
      {{ if $img }}
        {{ $img = $img.Filter images.AutoOrient }}
        {{ $v := $img.Resize "1100x q85" }}
        <img src="{{ $v.RelPermalink }}" alt="" loading="lazy">
      {{ else }}
        <img src="{{ . | relURL }}" alt="" loading="lazy">
      {{ end }}
    </figure>
    {{ end }}
  {{ end }}
</div>
{{ end }}
