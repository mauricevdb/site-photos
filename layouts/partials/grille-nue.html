{{ $pages := .pages }}
<div class="grille">
  {{ range $pages }}
  {{ $r := partial "ratio.html" (dict "page" .) }}
  <a class="tuile" href="{{ .RelPermalink }}"
     style="flex-grow: {{ math.Round (mul $r 100) }}; flex-basis: {{ math.Round (mul $r 240) }}px;">
    {{ partial "vignette.html" (dict "page" . "largeur" 800) }}
  </a>
  {{ end }}
</div>
