aide_impression: >-
  Le jet d'encre pigmentaire (impression giclée sur traceur Epson) dépose des encres
  pigmentaires d'une grande longévité sur des papiers d'art : précision du détail,
  large choix de textures et de tons. Le tirage argentique est le procédé photographique
  traditionnel : l'image est exposée sur un papier photosensible puis révélée par
  développement chimique — dégradés parfaitement continus, rendu classique d'une
  grande stabilité.
aide_papier: >-
  Mat : aucun reflet, rendu doux et feutré — en jet d'encre, l'Ultra Smooth Hahnemühle
  305 g offre une surface coton très lisse d'une extrême précision ; en argentique, le
  RC Couleur Mat Fuji 250 g. Satiné : l'équilibre idéal, couleurs riches sans reflets
  gênants — Hahnemühle Photo RC satiné 310 g en jet d'encre, RC Couleur Satiné Fuji en
  argentique. Brillant : noirs denses et contraste maximal — Photo Rag Baryta Hahnemühle
  315 g (couche barytée) en jet d'encre, RC Couleur Brillant Fuji en argentique.
