    supplement: 0
  - nom: Tirage argentique
    supplement: 10
aide_impression: |-
  Le jet d'encre pigmentaire (impression giclée sur traceur Epson) dépose des encres pigmentaires d'une grande longévité sur des papiers d'art : précision du détail, large choix de textures et de tons, du mat profond au baryté. 
  Le tirage argentique est le procédé photographique traditionnel : l'image est exposée sur un papier photosensible puis révélée par développement chimique — dégradés parfaitement continus, rendu photographique classique d'une grande stabilité.
