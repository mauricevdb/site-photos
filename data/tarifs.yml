aide_papier: |-
  Jet d'encre — 
  - Aquarelle Arches 310 g : véritable papier aquarelle 100 % coton, grain naturel marqué et ton chaud, pour un rendu pictural. 
  - Photo Rag Baryta 315 g : coton à la surface finement texturée et couche barytée brillante, couleurs profondes et détails éclatants, dans l'esprit des barytés traditionnels. 
  - Photo Rag Ultra Smooth 305 g : surface coton très lisse et douce, mat d'une extrême précision, idéal pour les images détaillées. 
  - Photo RC Satiné 310 g : papier photo satiné classique, rendu neutre et polyvalent. 

  Argentique (Fuji Crystal Archive) — 
  - Satiné : l'équilibre idéal, couleurs riches sans reflets gênants. 
  - Brillant : noirs denses et contraste maximal, surface sensible aux reflets. 
  - Mat : aucun reflet, rendu doux et feutré.
