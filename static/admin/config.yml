backend:
  name: github
  repo: mauricevdb/site-photos
  branch: main
  base_url: https://sveltia-cms-auth.maurice-vandenboo.workers.dev

site_url: https://radio-paris-samarcande.eu
media_folder: assets/images
public_folder: /images

collections:
  - name: photos
    label: Photos
    label_singular: Photo
    folder: content/photos
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{title}} — {{pays}}"
    sortable_fields: [title, date, pays]
    fields:
      - { name: title, label: Titre }
      - { name: date, label: "Date de capture (classement Archive)", widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: image, label: Image, widget: image }
      - { name: pays, label: "Pays (sert aux suggestions automatiques)", widget: select, options: [Italie, Bosnie, Macédoine du Nord, Turquie, Arménie, Kazakhstan, Ouzbékistan, Tadjikistan, Kyrgyzstan], required: false }
      - { name: galerie, label: "Afficher dans la Galerie", widget: boolean, default: false, required: false }
      - { name: archive, label: "Afficher dans l'Archive", widget: boolean, default: true, required: false }
      - name: suggestions
        label: "Suggestions manuelles (3 max — laisser vide pour l'automatique)"
        widget: list
        required: false
        max: 3
        field: { name: photo, label: Photo, widget: relation, collection: photos, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { name: sku, label: "Référence (ne pas modifier)", required: false }
      - { name: body, label: "Description (facultative)", widget: markdown, required: false }

  - name: tarifs
    label: "Tarifs & options"
    files:
      - name: tarifs
        label: "Modèle de pricing"
        file: data/tarifs.yml
        fields:
          - name: tailles
            label: "Tailles (grand côté en cm, cadre et son prix)"
            widget: list
            fields:
              - { name: nom, label: Nom }
              - { name: longueur, label: "Grand côté (cm)", widget: number }
              - { name: cadre, label: "Dimensions du cadre (texte affiché)" }
              - { name: prix_cadre, label: "Coût du cadre (€)", widget: number }
              - { name: poids_cadre, label: "Poids du cadre (g)", widget: number }
              - { name: poids_emballage, label: "Poids de l'emballage (g)", widget: number }
          - name: papiers
            label: "Papiers (prix au format de référence 30 × 40)"
            widget: list
            fields:
              - { name: impression, label: Impression, widget: select, options: ["Jet d'encre", "Argentique"] }
              - { name: finition, label: Finition, widget: select, options: [Mat, Satiné, Brillant] }
              - { name: nom, label: "Nom du papier" }
              - { name: grammage, label: "Grammage (g/m²)", widget: number }
              - { name: prix_ref, label: "Prix réf. 30×40 (€)", widget: number, value_type: float }
          - name: couts
            label: "Coûts fixes et marge"
            widget: object
            fields:
              - { name: site, label: "Coût site web (€)", widget: number, value_type: float }
              - { name: capex, label: "Amortissement CAPEX hors cadre (1.2 = +120 %)", widget: number, value_type: float }
              - { name: capex_cadre, label: "Amortissement CAPEX sur le cadre (0.05 = +5 %)", widget: number, value_type: float }
          - name: expedition
            label: "Frais d'expédition inclus dans le prix (par tranche de poids)"
            widget: list
            fields:
              - { name: jusqu_a, label: "Poids maximum (g)", widget: number }
              - { name: cout, label: "Coût (€)", widget: number, value_type: float }
          - { name: aide_impression, label: "Texte d'aide (ampoule impression)", widget: text }
          - { name: aide_papier, label: "Texte d'aide (ampoule papier)", widget: text }
      - name: archive
        label: "Réglage de l'Archive"
        file: data/archive.yml
        fields:
          - { name: granularite, label: "Regroupement", widget: select, options: [mois, annee], default: mois }

  - name: pages
    label: Pages du site
    files:
      - name: apropos
        label: "À propos"
        file: content/a-propos.md
        fields:
          - { name: title, label: Titre }
          - { name: velo, label: "Photo au vélo (paysage)", widget: image, required: false }
          - { name: carte, label: "Carte (paysage)", widget: image, required: false, hint: "Laisser /carte-voyage.jpg pour la carte dessinée" }
          - { name: instagram, label: "Lien Instagram", required: false }
          - { name: body, label: Texte, widget: markdown }
      - name: cgv
        label: "Conditions générales de vente"
        file: content/cgv.md
        fields:
          - { name: title, label: Titre }
          - { name: body, label: Texte, widget: markdown }
      - name: mentions
        label: "Mentions légales"
        file: content/mentions-legales.md
        fields:
          - { name: title, label: Titre }
          - { name: body, label: Texte, widget: markdown }
